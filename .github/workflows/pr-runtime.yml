name: Publish Windows PR runtime

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "llama.cpp pull request number"
        required: true
        type: string
      backend:
        description: "Backend to publish"
        required: true
        default: cpu
        type: choice
        options:
          - cpu

permissions:
  contents: read

jobs:
  build:
    name: Build PR ${{ inputs.pull_request }} (${{ inputs.backend }})
    runs-on: windows-latest
    # Backstop against a hung CMake configure/build or GitHub API call; a
    # CPU-only build normally finishes well within this.
    timeout-minutes: 60
    # This job compiles untrusted llama.cpp PR source with CMake. It reads
    # the PR's own repository only, uploads a raw unpackaged runtime
    # artifact, and never checks out trusted llama-board tooling, runs the
    # packaging script, or receives release/signing secrets. Uploading a
    # workflow artifact does not require the `actions` permission scope
    # (it uses the runner's own artifact service token), so no `actions:
    # write` is granted here.
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      repository: ${{ steps.provenance.outputs.repository }}
      head_ref: ${{ steps.provenance.outputs.head_ref }}
      author: ${{ steps.provenance.outputs.author }}
      state: ${{ steps.provenance.outputs.state }}
      fork: ${{ steps.provenance.outputs.fork }}
    steps:
      - name: Validate workflow inputs
        shell: pwsh
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
          PR_BACKEND: ${{ inputs.backend }}
        run: |
          if ($env:PR_NUMBER -notmatch '^[1-9][0-9]{0,17}$') {
            throw 'The pull request number must be a positive decimal integer.'
          }
          if ($env:PR_BACKEND -ne 'cpu') {
            throw 'This workflow currently publishes CPU bundles only.'
          }

      - name: Resolve PR provenance
        id: provenance
        shell: pwsh
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'llama-board-pr-runtime-workflow'
          }
          $uri = "https://api.github.com/repos/ggml-org/llama.cpp/pulls/$env:PR_NUMBER"
          $pr = Invoke-RestMethod -Uri $uri -Headers $headers -TimeoutSec 30
          if ([UInt64]$pr.number -ne [UInt64]$env:PR_NUMBER) {
            throw 'GitHub returned a different pull request number.'
          }
          if ([string]$pr.base.repo.full_name -ne 'ggml-org/llama.cpp') {
            throw 'The pull request is not based on ggml-org/llama.cpp.'
          }
          $repository = [string]$pr.head.repo.full_name
          $headRef = [string]$pr.head.ref
          $author = [string]$pr.user.login
          $commit = [string]$pr.head.sha
          $state = if ($pr.merged_at) { 'merged' } else { [string]$pr.state }
          if ($repository -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw 'The pull request head repository is unavailable or invalid.'
          }
          if ($commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'The pull request head did not resolve to a commit SHA.'
          }
          if ($repository -match '[`r`n]' -or $headRef -match '[`r`n]' -or $author -match '[`r`n]' -or $state -match '[`r`n]') {
            throw 'GitHub returned a line-break in PR provenance.'
          }
          $fork = ($repository -ne 'ggml-org/llama.cpp').ToString().ToLowerInvariant()
          Add-Content -Path $env:GITHUB_OUTPUT -Value ('repository=' + $repository)
          Add-Content -Path $env:GITHUB_OUTPUT -Value ('head_ref=' + $headRef)
          Add-Content -Path $env:GITHUB_OUTPUT -Value ('author=' + $author)
          Add-Content -Path $env:GITHUB_OUTPUT -Value ('state=' + $state)
          Add-Content -Path $env:GITHUB_OUTPUT -Value ('fork=' + $fork)
          Add-Content -Path $env:GITHUB_OUTPUT -Value ('commit=' + $commit)

      - name: Checkout llama.cpp pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ggml-org/llama.cpp
          ref: refs/pull/${{ inputs.pull_request }}/head
          path: llama.cpp
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve checked-out commit
        id: source
        shell: pwsh
        env:
          PR_EXPECTED_COMMIT: ${{ steps.provenance.outputs.commit }}
        run: |
          $commit = (& git -C llama.cpp rev-parse HEAD).Trim()
          if ($commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "The checked-out PR did not resolve to a commit SHA."
          }
          if ($commit -ine $env:PR_EXPECTED_COMMIT) {
            throw "The checked-out PR head changed while the workflow was starting."
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Configure CPU runtime
        shell: pwsh
        run: |
          cmake -S llama.cpp -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DLLAMA_BUILD_COMMON=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_BORINGSSL=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DFETCHCONTENT_QUIET=OFF -DGGML_CPU=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }

      - name: Build runtime targets
        shell: pwsh
        run: |
          cmake --build build --config Release --target llama-server llama-bench --parallel
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed." }

      - name: Locate and preflight runtime
        shell: pwsh
        run: |
          $server = Get-ChildItem -Path build -Filter llama-server.exe -Recurse -File | Select-Object -First 1
          if ($null -eq $server) { throw "llama-server.exe was not produced." }
          $runtime = $server.Directory.FullName
          $bench = Join-Path $runtime 'llama-bench.exe'
          if (-not (Test-Path -LiteralPath $bench -PathType Leaf)) {
            throw "llama-bench.exe was not produced beside llama-server.exe."
          }
          New-Item -ItemType Directory -Force -Path runtime-output | Out-Null
          Copy-Item -Path (Join-Path $runtime '*') -Destination runtime-output -Recurse -Force
          & $server --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server --version failed." }
          & $server --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "llama-server --help failed." }
          & $server --list-devices *> $null
          if ($LASTEXITCODE -ne 0) { throw "llama-server --list-devices failed." }
          & $bench --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "llama-bench --help failed." }

      - name: Upload raw runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-runtime-raw-${{ inputs.pull_request }}-${{ inputs.backend }}
          path: runtime-output
          if-no-files-found: error

  package:
    name: Package PR ${{ inputs.pull_request }} runtime bundle
    needs: build
    runs-on: windows-latest
    # Backstop against a hung packaging step; this job only moves and
    # packages an already-built runtime.
    timeout-minutes: 30
    # This job runs only trusted llama-board tooling against the raw
    # runtime artifact the build job produced. It never checks out or
    # executes PR source, and it receives no release/signing secrets. The
    # packaged archive's PR-derived executables are exercised only after
    # this job uploads the final immutable artifact, by the separate
    # low-trust `smoke` job below.
    permissions:
      contents: read
    steps:
      - name: Checkout trusted packaging tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: llama-board
          fetch-depth: 1
          persist-credentials: false

      - name: Download raw runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-runtime-raw-${{ inputs.pull_request }}-${{ inputs.backend }}
          path: runtime-output

      - name: Package portable runtime bundle
        shell: pwsh
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
          PR_BACKEND: ${{ inputs.backend }}
          PR_COMMIT: ${{ needs.build.outputs.commit }}
          PR_REPOSITORY: ${{ needs.build.outputs.repository }}
          PR_HEAD_REF: ${{ needs.build.outputs.head_ref }}
          PR_AUTHOR: ${{ needs.build.outputs.author }}
          PR_STATE: ${{ needs.build.outputs.state }}
          PR_FORK: ${{ needs.build.outputs.fork }}
        run: |
          ./llama-board/scripts/package-pr-runtime.ps1 -PullRequest ([UInt64]$env:PR_NUMBER) -Commit $env:PR_COMMIT -Backend $env:PR_BACKEND -Repository $env:PR_REPOSITORY -HeadRef $env:PR_HEAD_REF -Author $env:PR_AUTHOR -State $env:PR_STATE -Fork ($env:PR_FORK -eq 'true') -SourceRoot 'llama-board' -RuntimeRoot 'runtime-output' -OutputDirectory 'release-assets'

      - name: Upload portable runtime bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-runtime-${{ inputs.pull_request }}-${{ inputs.backend }}
          path: release-assets
          if-no-files-found: error

  smoke:
    name: Smoke test PR ${{ inputs.pull_request }} runtime bundle
    needs: [build, package]
    runs-on: windows-latest
    # Backstop against a hung smoke test; this job only extracts and
    # exercises an already-packaged runtime archive.
    timeout-minutes: 20
    # This job executes the PR-derived llama-server.exe/llama-bench.exe, so
    # it is treated as low-trust: unlike build/package it never checks out
    # any repository, runs the packaging/release scripts, or receives
    # release/signing secrets, and it holds no write-capable permissions.
    # It only downloads the final immutable artifact that the package job
    # already uploaded into an isolated temp directory on this runner,
    # smoke tests that extracted local copy, and discards it. Anything the
    # PR binary does to this runner's local files cannot affect the
    # immutable artifact the publish job downloads independently below.
    permissions: {}
    steps:
      - name: Download portable runtime bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-runtime-${{ inputs.pull_request }}-${{ inputs.backend }}
          path: release-assets

      - name: Smoke test packaged runtime
        shell: pwsh
        env:
          PR_REPOSITORY: ${{ needs.build.outputs.repository }}
          PR_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          $archive = Get-ChildItem -LiteralPath release-assets -Filter '*.zip' -File | Select-Object -First 1
          if ($null -eq $archive) { throw 'The portable runtime archive was not found.' }
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("llama-board-pr-smoke-" + [Guid]::NewGuid().ToString('N'))
          try {
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $smokeRoot -Force
            $runtime = Get-ChildItem -LiteralPath $smokeRoot -Directory | Select-Object -First 1
            if ($null -eq $runtime) { throw 'The portable runtime archive has no runtime root.' }
            $sourceManifest = Join-Path $runtime.FullName 'llama-board-runtime-source.json'
            $bundleManifest = Join-Path $runtime.FullName 'llama-board-runtime-bundle.json'
            if (-not (Test-Path -LiteralPath $sourceManifest -PathType Leaf)) { throw 'The source provenance manifest is missing from the archive.' }
            if (-not (Test-Path -LiteralPath $bundleManifest -PathType Leaf)) { throw 'The bundle manifest is missing from the archive.' }
            $manifest = Get-Content -LiteralPath $bundleManifest -Raw | ConvertFrom-Json
            if ($manifest.source.repository -ne $env:PR_REPOSITORY -or $manifest.source.commit -ine $env:PR_COMMIT) {
              throw 'The packaged provenance does not match the checked-out PR.'
            }
            $server = Join-Path $runtime.FullName 'llama-server.exe'
            $bench = Join-Path $runtime.FullName 'llama-bench.exe'
            if (-not (Test-Path -LiteralPath $server -PathType Leaf) -or -not (Test-Path -LiteralPath $bench -PathType Leaf)) { throw 'The extracted runtime is missing its executables.' }
            $env:Path = $runtime.FullName
            foreach ($name in @('CUDA_PATH', 'CUDA_HOME', 'CUDA_TOOLKIT_ROOT_DIR', 'CUDACXX', 'HIP_PATH', 'ROCM_PATH', 'VULKAN_SDK', 'VK_SDK_PATH', 'ROCBLAS_TENSILE_LIBPATH', 'HIPBLASLT_TENSILE_LIBPATH')) {
              Remove-Item -LiteralPath ("Env:" + $name) -ErrorAction SilentlyContinue
            }
            & $server --version
            if ($LASTEXITCODE -ne 0) { throw 'Packaged llama-server --version failed.' }
            & $server --help *> $null
            if ($LASTEXITCODE -ne 0) { throw 'Packaged llama-server --help failed.' }
            & $server --list-devices *> $null
            if ($LASTEXITCODE -ne 0) { throw 'Packaged llama-server --list-devices failed.' }
            & $bench --help *> $null
            if ($LASTEXITCODE -ne 0) { throw 'Packaged llama-bench --help failed.' }
          } finally {
            if (Test-Path -LiteralPath $smokeRoot) { Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue }
          }

  publish:
    name: Publish PR ${{ inputs.pull_request }} runtime release
    needs: smoke
    runs-on: ubuntu-latest
    # Backstop against a hung artifact download or release publish; this
    # job only moves an already-built archive.
    timeout-minutes: 15
    environment: pr-runtime-publish
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download portable runtime bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-runtime-${{ inputs.pull_request }}-${{ inputs.backend }}
          path: release-assets

      - name: Publish PR runtime release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: pr-runtime-${{ inputs.pull_request }}
          target_commitish: main
          name: llama.cpp PR ${{ inputs.pull_request }} runtime
          body: |
            Prebuilt llama-board runtime for llama.cpp PR #${{ inputs.pull_request }}.
            The ZIP embeds the checked-out commit and a file-level SHA-256 manifest.
            This release is generated by the manually triggered PR runtime workflow.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.zip.sha256
            release-assets/checksums.txt
