name: Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  RUST_BACKTRACE: "1"
  LLAMA_BOARD_ALLOW_UNSIGNED_RELEASES: ${{ vars.LLAMA_BOARD_ALLOW_UNSIGNED_RELEASES || 'false' }}

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve version and release state
        id: resolve
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("node:fs");

            const readJson = (file) => JSON.parse(fs.readFileSync(file, "utf8"));
            const packageJson = readJson("package.json");
            const packageLock = readJson("package-lock.json");
            const version = packageJson.version;

            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(`package.json has an invalid release version: ${version}`);
            }

            const cargoVersion = fs
              .readFileSync("src-tauri/Cargo.toml", "utf8")
              .match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            const cargoLockVersion = fs
              .readFileSync("src-tauri/Cargo.lock", "utf8")
              .match(/\[\[package\]\]\s+name\s*=\s*"llama-board"\s+version\s*=\s*"([^"]+)"/m)?.[1];
            const declaredVersions = {
              "package.json": version,
              "package-lock.json": packageLock.packages?.[""]?.version,
              "src-tauri/Cargo.toml": cargoVersion,
              "src-tauri/Cargo.lock": cargoLockVersion,
              "src-tauri/tauri.conf.json": readJson("src-tauri/tauri.conf.json").version,
              "src-tauri/tauri-cli-build.conf.json": readJson("src-tauri/tauri-cli-build.conf.json").version,
            };

            for (const [file, declaredVersion] of Object.entries(declaredVersions)) {
              if (declaredVersion !== version) {
                throw new Error(
                  `Release version mismatch: ${file} declares ${declaredVersion ?? "<missing>"}, expected ${version}`,
                );
              }
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (context.ref !== "refs/heads/main") {
              throw new Error(`Release workflow must run from main, not ${context.ref}`);
            }
            const tagName = `v${version}`;

            let releaseExists = false;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
              releaseExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const parseVersion = (value) => {
              const match = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(value ?? "");
              return match ? match.slice(1).map(Number) : null;
            };
            const compareVersions = (left, right) => {
              for (let index = 0; index < left.length; index += 1) {
                if (left[index] !== right[index]) return left[index] - right[index];
              }
              return 0;
            };

            if (!releaseExists) {
              let latestRelease = null;
              try {
                latestRelease = (await github.rest.repos.getLatestRelease({ owner, repo })).data;
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              const latestVersion = parseVersion(latestRelease?.tag_name);
              if (latestVersion && compareVersions(parseVersion(version), latestVersion) <= 0) {
                throw new Error(
                  `Release version ${version} must be newer than the latest release ${latestRelease.tag_name}`,
                );
              }
            }

            let targetSha = context.sha;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tagName}` });
              targetSha = ref.data.object.sha;

              if (ref.data.object.type === "tag") {
                const annotatedTag = await github.rest.git.getTag({
                  owner,
                  repo,
                  tag_sha: targetSha,
                });
                targetSha = annotatedTag.data.object.sha;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (!releaseExists && targetSha !== context.sha) {
              throw new Error(`Tag ${tagName} already points to ${targetSha}, not the current main commit ${context.sha}`);
            }

            core.setOutput("should_release", releaseExists ? "false" : "true");
            core.setOutput("tag_name", tagName);
            core.setOutput("target_sha", targetSha);
            core.setOutput("version", version);

            if (releaseExists) {
              core.info(`Release ${tagName} already exists; skipping duplicate publication.`);
            } else {
              core.info(`Release ${tagName} will be built from ${targetSha}.`);
            }

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    name: Build Windows installers
    runs-on: windows-latest
    # Backstop against a hung verification step or NSIS/MSI packaging;
    # normal runs finish well within this.
    timeout-minutes: 60
    # This job only builds and tests the repository's own source and
    # collects unsigned installer assets. It never receives the SignPath
    # API token and has no release-publish permission, so a
    # compromised npm/cargo dependency here cannot reach signing material
    # or the release API.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild esbuild
        run: npm rebuild esbuild
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: Build CLI resource
        run: npm run build:cli
      - name: Verify before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm test
          if ($LASTEXITCODE -ne 0) { throw "npm test failed with exit code $LASTEXITCODE" }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "npm run typecheck failed with exit code $LASTEXITCODE" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed with exit code $LASTEXITCODE" }
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt --check failed with exit code $LASTEXITCODE" }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed with exit code $LASTEXITCODE" }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed with exit code $LASTEXITCODE" }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw "npm run lint failed with exit code $LASTEXITCODE" }
          if ([string]::IsNullOrWhiteSpace($env:LLAMA_BOARD_SMOKE)) {
            Write-Warning "Real-model smoke test was not enabled; release verification covers unit/integration tests only."
          }
      - name: Build NSIS and MSI
        run: npx tauri build --config src-tauri/tauri-package.conf.json --bundles nsis,msi
      - name: Collect unsigned release assets
        shell: pwsh
        run: |
          $assetDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $files = @(Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | Where-Object {
            $_.Name -like "llama-board_*_x64-setup.exe" -or $_.Name -like "llama-board_*_x64_en-US.msi"
          })
          if ($files.Count -ne 2) { throw "Expected exactly one NSIS and one MSI installer asset, found $($files.Count)" }
          foreach ($file in $files) { Copy-Item $file.FullName (Join-Path $assetDir $file.Name) -Force }
          Copy-Item "install.ps1" (Join-Path $assetDir "install.ps1") -Force
      - name: Validate SignPath artifact configuration
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          [xml]$config = Get-Content -Raw -Encoding utf8 ".signpath/artifact-configurations/windows-release.xml"
          $root = $config.SelectSingleNode("/*[local-name()='artifact-configuration']/*[local-name()='zip-file']")
          if ($null -eq $root) { throw "SignPath artifact configuration must use zip-file as its root artifact." }
          $versionParameter = $config.SelectSingleNode("//*[local-name()='parameter' and @name='version']")
          if ($null -eq $versionParameter -or $versionParameter.required -ne "true") { throw "SignPath artifact configuration must require the release version parameter." }
          $expectedNsis = "llama-board_{0}_x64-setup.exe" -f $env:RELEASE_VERSION
          $expectedMsi = "llama-board_{0}_x64_en-US.msi" -f $env:RELEASE_VERSION
          $configuredPaths = @($root.SelectNodes("*[local-name()='pe-file' or local-name()='msi-file' or local-name()='powershell-file']") | ForEach-Object { $_.path })
          if ($configuredPaths -notcontains 'llama-board_${version}_x64-setup.exe' -or $configuredPaths -notcontains 'llama-board_${version}_x64_en-US.msi' -or $configuredPaths -notcontains 'install.ps1') {
            throw "SignPath artifact configuration does not cover the expected release assets."
          }
          $assetNames = @(Get-ChildItem -LiteralPath "release-assets" -File | Select-Object -ExpandProperty Name)
          foreach ($expected in @($expectedNsis, $expectedMsi, "install.ps1")) {
            if ($assetNames -notcontains $expected) { throw "Release asset $expected is missing." }
          }
      - name: Upload unsigned release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-assets-unsigned
          path: release-assets
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    name: Sign or publish installers and release
    runs-on: windows-latest
    # Backstop against a hung signing call or release publish; this job only
    # signs (when configured) and moves already-built installers.
    timeout-minutes: 20
    environment: release-publish
    # Only this job holds the SignPath API token and contents:write; it
    # downloads the artifact the build job produced and never runs
    # npm/cargo/checkout against source.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download unsigned release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release-assets-unsigned
          path: release-assets
      - name: Check installer signing mode
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $hasSignPathToken = -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)
          $signPathSettings = @{
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
            SIGNPATH_ARTIFACT_CONFIGURATION_SLUG = $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
          }
          $missingSettings = @($signPathSettings.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Key })
          $hasAnySignPathSetting = $hasSignPathToken -or ($signPathSettings.Values | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count -gt 0
          $allowUnsigned = $env:LLAMA_BOARD_ALLOW_UNSIGNED_RELEASES -match "^(?i:1|true|yes)$"

          if ($hasSignPathToken -and $missingSettings.Count -eq 0) {
            "mode=signpath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "==> SignPath signing enabled."
          } elseif ($hasAnySignPathSetting) {
            throw "SignPath is partially configured. Add SIGNPATH_API_TOKEN plus SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG, and SIGNPATH_ARTIFACT_CONFIGURATION_SLUG."
          } elseif ($allowUnsigned) {
            "mode=unsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Warning "SignPath is not configured; publishing an unsigned release because LLAMA_BOARD_ALLOW_UNSIGNED_RELEASES is enabled."
          } else {
            throw "SignPath is not configured. Add SIGNPATH_API_TOKEN and the four SIGNPATH_* repository variables, or set LLAMA_BOARD_ALLOW_UNSIGNED_RELEASES=true to explicitly allow an unsigned bootstrap release."
          }

      - name: Upload artifact for SignPath
        id: upload-signpath-artifact
        if: ${{ steps.signing.outputs.mode == 'signpath' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llama-board-${{ needs.prepare.outputs.version }}-signpath-input
          path: release-assets
          if-no-files-found: error

      - name: Submit signing request to SignPath
        id: signpath
        if: ${{ steps.signing.outputs.mode == 'signpath' }}
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-signpath-artifact.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: signed-assets
          parameters: |
            version: ${{ toJSON(needs.prepare.outputs.version) }}

      - name: Replace release assets with SignPath output
        if: ${{ steps.signing.outputs.mode == 'signpath' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedFiles = @(Get-ChildItem -LiteralPath "release-assets" -File | Where-Object { $_.Extension -in @('.exe', '.msi', '.ps1') })
          if ($expectedFiles.Count -lt 3) { throw "Expected NSIS, MSI, and install.ps1 release assets before signing." }
          foreach ($file in $expectedFiles) {
            $matches = @(Get-ChildItem -LiteralPath "signed-assets" -Recurse -File | Where-Object { $_.Name -eq $file.Name })
            if ($matches.Count -ne 1) { throw "SignPath output did not contain exactly one signed copy of $($file.Name)." }
            Copy-Item -LiteralPath $matches[0].FullName -Destination $file.FullName -Force
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne "Valid") { throw "SignPath Authenticode verification failed for $($file.Name): $($signature.Status)" }
          }
      - name: Generate checksums
        shell: pwsh
        run: |
          $assetDir = "release-assets"
          $manifest = foreach ($file in (Get-ChildItem $assetDir -File | Sort-Object Name)) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $manifest | Set-Content -LiteralPath (Join-Path $assetDir "checksums.txt") -Encoding ascii
          Get-Content (Join-Path $assetDir "checksums.txt")
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ needs.prepare.outputs.target_sha }}
          body: |
            Code signing policy: https://github.com/joowon-jang/llama-board/blob/main/CODE_SIGNING_POLICY.md
            Signing mode: ${{ steps.signing.outputs.mode }}
            ${{ steps.signpath.outputs.signing-request-web-url && format('SignPath signing request: {0}', steps.signpath.outputs.signing-request-web-url) || '' }}
            ${{ steps.signing.outputs.mode == 'unsigned' && 'This release is unsigned because SignPath is not configured. Verify the SHA-256 checksum before installing.' || '' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

