name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest
    # Backstop against a hung verification step or NSIS/MSI packaging;
    # normal runs finish well within this.
    timeout-minutes: 60
    # This job only builds and tests the repository's own source and
    # collects unsigned installer assets. It never receives the signing
    # certificate secrets and has no release-publish permission, so a
    # compromised npm/cargo dependency here cannot reach signing material
    # or the release API.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild esbuild
        run: npm rebuild esbuild
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: Build CLI resource
        run: npm run build:cli
      - name: Verify before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm test
          if ($LASTEXITCODE -ne 0) { throw "npm test failed with exit code $LASTEXITCODE" }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "npm run typecheck failed with exit code $LASTEXITCODE" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed with exit code $LASTEXITCODE" }
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt --check failed with exit code $LASTEXITCODE" }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed with exit code $LASTEXITCODE" }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed with exit code $LASTEXITCODE" }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw "npm run lint failed with exit code $LASTEXITCODE" }
          if ([string]::IsNullOrWhiteSpace($env:LLAMA_BOARD_SMOKE)) {
            Write-Warning "Real-model smoke test was not enabled; release verification covers unit/integration tests only."
          }
      - name: Build NSIS and MSI
        run: npm run tauri build -- --bundles nsis,msi
      - name: Collect unsigned release assets
        shell: pwsh
        run: |
          $assetDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $files = @(Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.msi') })
          if ($files.Count -lt 2) { throw "Expected both NSIS and MSI installer assets" }
          foreach ($file in $files) { Copy-Item $file.FullName (Join-Path $assetDir $file.Name) -Force }
          Copy-Item "install.ps1" (Join-Path $assetDir "install.ps1") -Force
      - name: Upload unsigned release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-assets-unsigned
          path: release-assets
          if-no-files-found: error

  publish:
    name: Sign installers and publish release
    needs: build
    runs-on: windows-latest
    # Backstop against a hung signing call or release publish; this job
    # only signs and moves already-built installers.
    timeout-minutes: 20
    environment: release-publish
    # Only this job holds the signing certificate secrets and
    # contents:write; it downloads the artifact the build job produced and
    # never runs npm/cargo/checkout against source.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download unsigned release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release-assets-unsigned
          path: release-assets
      - name: Sign installers (requires certificate secrets)
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Code-signing secrets (WINDOWS_CERTIFICATE_BASE64 / WINDOWS_CERTIFICATE_PASSWORD) are not configured in the release-publish environment. Configure the environment secrets or explicitly allow unsigned releases."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "llama-board-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signTool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($signTool)) {
            $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ([string]::IsNullOrWhiteSpace($signTool)) {
            throw "signtool.exe was not found on the Windows runner"
          }
          $files = @(Get-ChildItem -Path "release-assets" -File | Where-Object { $_.Extension -in @('.exe', '.msi') })
          foreach ($file in $files) {
            & $signTool sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($file.Name)" }
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne "Valid") { throw "Authenticode verification failed for $($file.Name): $($signature.Status)" }
          }
      - name: Generate checksums
        shell: pwsh
        run: |
          $assetDir = "release-assets"
          $manifest = foreach ($file in (Get-ChildItem $assetDir -File | Sort-Object Name)) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $manifest | Set-Content -LiteralPath (Join-Path $assetDir "checksums.txt") -Encoding ascii
          Get-Content (Join-Path $assetDir "checksums.txt")
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
