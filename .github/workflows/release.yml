name: Release runtime assets
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to attach runtime assets to
        required: true
        type: string

jobs:
  manifest:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime asset layout
        shell: pwsh
        run: |
          $required = @('cpu','vulkan','cuda','hip-rocm','sycl')
          New-Item -ItemType Directory -Force runtime-assets | Out-Null
          foreach ($backend in $required) {
            $placeholder = Join-Path runtime-assets "llama-runtime-$backend-windows-x64.zip"
            if (-not (Test-Path $placeholder)) { Write-Host "No bundled artifact supplied for $backend; system-linked runtime remains supported." }
          }
      - name: Publish supplied runtime assets
        if: ${{ hashFiles('runtime-assets/*') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          Get-ChildItem runtime-assets | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } | Set-Content runtime-assets/checksums.txt
          gh release upload $env:VERSION runtime-assets/* --clobber
