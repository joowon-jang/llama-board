[package]
name = "llama-board"
version = "0.1.4"
default-run = "llama-board"
description = "llama-board: Tauri desktop GUI for llama.cpp"
authors = ["joojoo"]
edition = "2021"

[lib]
name = "llama_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["process", "fs", "time", "macros", "rt-multi-thread", "io-util", "net", "sync"] }
futures-util = "0.3"
which = "6"
zip = "2"
pdf-extract = "0.12"
csv = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
libc = "0.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry"] }
