[package]
name = "llama-board"
version = "0.1.1"
description = "llama-board: Tauri desktop GUI for llama.cpp"
authors = ["joojoo"]
edition = "2021"

[lib]
name = "llama_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["process", "fs", "time", "macros", "rt-multi-thread"] }
which = "6"
zip = "2"
csv = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
