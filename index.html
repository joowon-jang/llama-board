<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Local llama.cpp runtime manager and chat client" />
    <script>
      (() => {
        const stored = localStorage.getItem("llama-board-theme") || (() => { try { return JSON.parse(localStorage.getItem("llama-board-preferences") || "null")?.values?.theme; } catch { return null; } })();
        const mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
        const resolved = mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : mode === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        const language = navigator.language.toLowerCase();
        document.documentElement.lang = language.startsWith("ko") ? "ko" : language.startsWith("ja") ? "ja" : language.startsWith("zh") ? "zh" : "en";
      })();
    </script>
    <title>llama-board</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
